apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-demo
  labels:
    app.kubernetes.io/name: supply-chain-demo
    app.kubernetes.io/part-of: k8s-supply-chain-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: supply-chain-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supply-chain-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replaced at apply time with the signed, digest-pinned reference.
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
